<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você decide o futuro da IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cor-fundo: #050b14;
            --cor-principal: #0d1527;
            --cor-secundaria: #17223b; 
            --cor-destaque: #00f0ff;
            --cor-texto: #e2f1f8;
            --borda-glow: rgba(0, 240, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--cor-fundo);
            background-image: radial-gradient(circle at 50% 0%, #111e38 0%, var(--cor-fundo) 70%);
            color: var(--cor-texto);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .caixa-principal {
            background-color: var(--cor-principal);
            border: 1px solid var(--borda-glow);
            border-radius: 20px;
            width: 100%;
            max-width: 650px;
            text-align: center;
            padding: 35px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(0, 240, 255, 0.1);
        }

        h1 {
            color: var(--cor-destaque);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .caixa-perguntas {
            font-size: 1.15rem;
            line-height: 1.6;
            font-weight: 400;
            margin-bottom: 25px;
            color: var(--cor-texto);
        }

        .caixa-alternativas {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            background-color: var(--cor-secundaria);
            color: var(--cor-texto);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            line-height: 1.4;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background-color: var(--cor-destaque);
            color: var(--cor-fundo);
            border-color: var(--cor-destaque);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 240, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .caixa-resultado {
            margin-top: 15px;
        }

        .texto-resultado {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--cor-texto);
            text-align: justify;
            background-color: rgba(0, 0, 0, 0.25);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--cor-destaque);
        }
    </style>
</head>
<body>
    <div class="caixa-principal">
        <h1>Você decide o futuro da IA</h1>
        <div class="caixa-perguntas"></div>
        <div class="caixa-alternativas"></div>
        <div class="caixa-resultado">
            <p class="texto-resultado"></p>
        </div>
    </div>

    <script>
        const caixaPrincipal = document.querySelector(".caixa-principal");
        const caixaPerguntas = document.querySelector(".caixa-perguntas");
        const caixaAlternativas = document.querySelector(".caixa-alternativas");
        const caixaResultado = document.querySelector(".caixa-resultado");
        const textoResultado = document.querySelector(".texto-resultado");

        const perguntas = [
            {
                enunciado: "Assim que saiu da escola você se depara com uma nova tecnologia, um chat que consegue responder todas as dúvidas que uma pessoa pode ter, ele também gera imagens e áudios hiper-realistas. Qual o primeiro pensamento?",
                alternativas: [
                    {
                        texto: "Isso é assustador!",
                        afirmacao: "No início ficou com medo do que essa tecnologia pode fazer."
                    },
                    {
                        texto: "Isso é maravilhoso!",
                        afirmacao: "Quis saber como usar IA no seu dia a dia."
                    }
                ]
            },
            {
                enunciado: "Com a descoberta desta tecnologia, chamada Inteligência Artificial, uma professora de tecnologia da escola decidiu fazer uma sequência de aulas sobre esta tecnologia. No fim de uma aula ela pede que você escreva um trabalho sobre o uso de IA em sala de aula. Qual atitude você toma?",
                alternativas: [
                    {
                        texto: "Utiliza uma ferramenta de busca na internet que utiliza IA para que ela ajude a encontrar informações relevantes para o trabalho e explique numa linguagem que facilite o entendimento.",
                        afirmacao: "Conseguiu utilizar a IA para buscar informações úteis."
                    },
                    {
                        texto: "Escreve o trabalho com base nas conversas que teve com colegas, algumas pesquisas na internet e conhecimentos próprios sobre o tema.",
                        afirmacao: "Sentiu mais facilidade em utilizar seus próprios recursos para escrever seu trabalho."
                    }
                ]
            },
            {
                enunciado: "Após a elaboração do trabalho escrito, a professora realizou um debate entre a turma para entender como foi realizada a pesquisa e escrita. Nessa conversa também foi levantado um ponto muito importante: como a IA impacta o trabalho do futuro. Nesse debate, como você se posiciona?",
                alternativas: [
                    {
                        texto: "Defende a ideia de que a IA pode criar novas oportunidades de emprego e melhorar habilidades humanas.",
                        afirmacao: "Vem impulsionando a inovação na área de IA e luta para abrir novos caminhos profissionais com IA."
                    },
                    {
                        texto: "Me preocupo com as pessoas que perderão seus empregos para máquinas e defendem a importância de proteger os trabalhadores.",
                        afirmacao: "Sua preocupação com as pessoas motivou a criar um grupo de estudos entre trabalhadores para discutir meios de utilização de IA de forma ética."
                    }
                ]
            },
            {
                enunciado: "Ao final da discussão, você precisou criar uma imagem no computador que representasse o que pensa sobre IA. E agora?",
                alternativas: [
                    {
                        texto: "Criar uma imagem utilizando uma plataforma de design como o Paint.",
                        afirmacao: "Notou também que muitas pessoas não sabem ainda utilizar as ferramentas tradicionais e decidiu compartilhar seus conhecimentos de design utilizando ferramentas de pintura digital para iniciantes."
                    },
                    {
                        texto: "Criar uma imagem utilizando um gerador de imagem de IA.",
                        afirmacao: "Acelerou o processo de criação de trabalhos utilizando geradores de imagem e agora consegue ensinar pessoas que sentem dificuldades em desenhar manualmente como utilizar também!"
                    }
                ]
            },
            {
                enunciado: "Você tem um trabalho em grupo de biologia para entregar na semana seguinte, o andamento do trabalho está um pouco atrasado e uma pessoa do seu grupo decidiu fazer com ajuda da IA. O problema é que o trabalho está totalmente igual ao do chat. O que você faz?",
                alternativas: [
                    {
                        texto: "Escrever comandos para o chat é uma forma de contribuir com o trabalho, por isso não é um problema utilizar o texto inteiro.",
                        afirmacao: "Infelizmente passou a utilizar a IA para fazer todas suas tarefas e agora se sente dependente da IA para tudo."
                    },
                    {
                        texto: "O chat pode ser uma tecnologia muito avançada, mas é preciso manter a atenção pois toda máquina erra, por isso revisar o trabalho e contribuir com as perspectivas pessoais é essencial.",
                        afirmacao: "Percebeu que toda IA reproduz orientações baseadas na empresa que programou e muito do que o chat escrevia não refletia o que pensava e por isso sabe que os textos gerados pela IA devem servir como auxílio e não resultado final."
                    }
                ]
            }
        ];

        let atual = 0;
        let perguntaAtual;
        let historiaFinal = "";

        function mostraPergunta() {
            if (atual >= perguntas.length) {
                mostraResultado();
                return;
            }
            perguntaAtual = perguntas[atual];
            caixaPerguntas.textContent = perguntaAtual.enunciado;
            caixaAlternativas.textContent = "";
            mostraAlternativas();
        }

        function mostraAlternativas() {
            for (const alternativa of perguntaAtual.alternativas) {
                const botaoAlternativas = document.createElement("button");
                botaoAlternativas.textContent = alternativa.texto;
                botaoAlternativas.addEventListener("click", () => respostaSelecionada(alternativa));
                caixaAlternativas.appendChild(botaoAlternativas);
            }
        }

        function respostaSelecionada(opcaoSelecionada) {
            const afirmacoes = opcaoSelecionada.afirmacao;
            historiaFinal += afirmacoes + " ";
            atual++;
            mostraPergunta();
        }

        function mostraResultado() {
            caixaPerguntas.textContent = "Em 2049...";
            textoResultado.textContent = historiaFinal;
            caixaAlternativas.textContent = "";
        }

        mostraPergunta();
    </script>
</body>
</html>
